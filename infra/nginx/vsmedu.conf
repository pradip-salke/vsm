# Example production vhost layout. Install TLS certificates and replace server names
# before enabling this file. Public web, admin and API remain separate processes.
upstream vsmedu_web { server 127.0.0.1:3000; keepalive 32; }
upstream vsmedu_api { server 127.0.0.1:4000; keepalive 32; }

server {
    listen 80;
    server_name vsmedu.com www.vsmedu.com admin.vsmedu.com api.vsmedu.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name vsmedu.com www.vsmedu.com;
    ssl_certificate /etc/letsencrypt/live/vsmedu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vsmedu.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location / { proxy_pass http://vsmedu_web; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}

server {
    listen 443 ssl http2;
    server_name api.vsmedu.com;
    ssl_certificate /etc/letsencrypt/live/vsmedu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vsmedu.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 256k;
    location / { proxy_pass http://vsmedu_api; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}

server {
    listen 443 ssl http2;
    server_name admin.vsmedu.com;
    root /var/www/vsmedu/admin;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/vsmedu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vsmedu.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.vsmedu.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location /api/v1/ { proxy_pass http://vsmedu_api; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location / { try_files $uri $uri/ /index.html; }
}
